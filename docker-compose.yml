services:
  postgres:
    image: postgres:16-alpine
    container_name: charme-modas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: charme
      POSTGRES_PASSWORD: charme
      POSTGRES_DB: charme_modas
    ports:
      - "5432:5432"
    volumes:
      - charme_modas_pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: charme-modas-backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3333
      - LOJA_ORIGENS=${LOJA_ORIGENS}
      - LOJA_URL=${LOJA_URL}
      - EMAIL_FROM=${EMAIL_FROM}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - postgres
    networks:
      - app-network

  frontend-admin:
    build: ./frontend-admin
    container_name: charme-modas-admin
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  frontend-loja:
    build: ./frontend-loja
    container_name: charme-modas-loja
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  proxy:
    build: ./proxy
    container_name: charme-modas-proxy
    restart: unless-stopped
    ports:
      - "30001:80"
    depends_on:
      - frontend-admin
      - frontend-loja
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  charme_modas_pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: charme-modas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: charme
      POSTGRES_PASSWORD: charme
      POSTGRES_DB: charme_modas
    ports:
      - "5432:5432"
    volumes:
      - charme_modas_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: charme-modas-backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres

  frontend-admin:
    build: ./frontend-admin
    container_name: charme-modas-admin
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  frontend-loja:
    build: ./frontend-loja
    container_name: charme-modas-loja
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  charme_modas_pgdata:
